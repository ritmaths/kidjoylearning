
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Fun Learn</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        quicksand: ['Quicksand', 'sans-serif']
                    },
                    colors: {
                        funYellow: '#FFD166',
                        funGreen: '#06D6A0',
                        funBlue: '#118AB2',
                        funPink: '#EF476F',
                        funPurple: '#073B4C'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #F8F9FA;
            user-select: none;
        }
        
        .tab-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .tab-scroll::-webkit-scrollbar-thumb {
            background-color: #CBD5E1;
            border-radius: 9999px;
        }

        /* Module 5: Place Value Stack */
        .block-stack {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            min-height: 180px;
            justify-content: flex-start;
        }

        .unit-cube {
            width: 24px;
            height: 24px;
            background: #EF476F;
            border: 2px solid #b82b4b;
            border-radius: 4px;
            margin: 1px 0;
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }

        .ten-rod {
            width: 32px;
            height: 20px;
            background: #FFD166;
            border: 2px solid #d4a02c;
            border-radius: 4px;
            margin: 1px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #523f00;
        }

        .hundred-flat {
            width: 48px;
            height: 18px;
            background: #06D6A0;
            border: 2px solid #048c69;
            border-radius: 4px;
            margin: 1px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #02382a;
        }

        .thousand-cube {
            width: 60px;
            height: 20px;
            background: #118AB2;
            border: 2px solid #0a526b;
            border-radius: 4px;
            margin: 1px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #ffffff;
        }

        /* Custom Bounce Animation for Stars */
        @keyframes popStar {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .pop-star {
            animation: popStar 0.4s ease-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-50 text-slate-800">

    <!-- App Header -->
    <header class="bg-white border-b-2 border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-400 to-orange-500 flex items-center justify-center text-white text-xl shadow-md font-fredoka">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 class="text-xl md:text-2xl font-bold font-fredoka text-slate-800 tracking-wide">
                    Interactive Fun Learn
                </h1>
            </div>

            <!-- Star Points Counter -->
            <div class="flex items-center gap-2 bg-amber-50 border-2 border-amber-200 px-4 py-1.5 rounded-full shadow-inner">
                <i class="fa-solid fa-star text-amber-500 text-xl pop-star"></i>
                <span id="star-count" class="font-fredoka text-xl text-amber-700">0</span>
                <span class="text-xs font-bold uppercase tracking-wider text-amber-600 hidden sm:inline">Stars</span>
            </div>
        </div>

        <!-- Scrollable Module Tabs -->
        <div class="bg-slate-100 border-t border-slate-200">
            <div class="max-w-6xl mx-auto px-2 overflow-x-auto tab-scroll py-2 flex gap-2" id="module-tabs">
                <!-- Dynamic tabs inserted here via JS -->
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-1 flex flex-col justify-center my-4">
        
        <!-- Action Control Bar -->
        <div class="flex justify-between items-center mb-6 bg-white p-3 rounded-2xl border-2 border-slate-200 shadow-sm">
            <div class="flex items-center gap-2 text-slate-600 font-semibold text-sm">
                <span id="module-indicator" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-fredoka">
                    Module 1
                </span>
                <span id="ai-badge" class="hidden sm:inline-flex items-center gap-1 bg-emerald-100 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-bold">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Gemini AI
                </span>
            </div>

            <button id="btn-new-q" onclick="fetchNewQuestion(true)" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl transition-all shadow-md active:scale-95 flex items-center gap-2 text-sm md:text-base">
                <i class="fa-solid fa-rotate-right" id="new-q-icon"></i>
                <span>New Question</span>
            </button>
        </div>

        <!-- Dynamic Module Stage -->
        <div id="module-stage" class="bg-white rounded-3xl border-2 border-slate-200 p-6 md:p-8 shadow-md relative min-h-[380px] flex flex-col justify-center items-center">
            <!-- Content render targets -->
        </div>

        <!-- Toast Notification Area -->
        <div id="toast" class="hidden fixed bottom-16 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-2xl text-white font-bold text-lg shadow-xl transition-all flex items-center gap-2"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-slate-500 font-semibold text-sm">
        Designed & Created by Srikantha N for Young Learners
    </footer>

    <script>
        /*
         * App Modules State & Data Setup
         */
        const MODULES = [
            { id: 'flashcards', name: 'Word Flashcards', icon: 'fa-spell-check' },
            { id: 'sentences', name: 'Simple Sentences', icon: 'fa-book-open' },
            { id: 'froggy', name: 'Froggy Jump', icon: 'fa-frog' },
            { id: 'thousands', name: 'Numbers to Thousands', icon: 'fa-arrow-up-9-1' },
            { id: 'placevalue', name: 'Place Value', icon: 'fa-cubes' },
            { id: 'addition', name: 'Addition w/ Carry', icon: 'fa-plus' },
            { id: 'subtraction', name: 'Subtraction w/ Borrow', icon: 'fa-minus' },
            { id: 'multiplication', name: 'Multiplication', icon: 'fa-xmark' },
            { id: 'ordering', name: 'Ascending / Descending', icon: 'fa-stairs' }
        ];

        let currentModuleIndex = 0;
        let starPoints = 0;
        let currentQuestionData = null;
        let isAILoading = false;

        // User Interactive State for complex modules
        let pvUserCounts = { thousands: 0, hundreds: 0, tens: 0, units: 0 };

        /* =========================================================================
           LOCAL FALLBACK GENERATOR POOLS (Guarantees uninterrupted play offline)
           ========================================================================= */
        const FALLBACK_POOLS = {
            flashcards: [
                { word: "ELEPHANT", category: "Animals", hint: "A large land animal with a trunk" },
                { word: "SUNSHINE", category: "Nature", hint: "Warm bright light from the sky" },
                { word: "BUTTERFLY", category: "Insects", hint: "Colorful flying insect" },
                { word: "RAINBOW", category: "Nature", hint: "Multi-colored arc in the sky" },
                { word: "EXPLORER", category: "Action", hint: "Someone who travels to discover" },
                { word: "KANGAROO", category: "Animals", hint: "Australian hopping animal" },
                { word: "ASTRONAUT", category: "Space", hint: "Person who travels into space" }
            ],
            sentences: [
                { text: "The bright ___ shines in the blue sky.", blank: "sun", options: ["sun", "fish", "tree"], full: "The bright sun shines in the blue sky." },
                { text: "Little monkeys love to eat ripe ___.", blank: "bananas", options: ["bananas", "rocks", "shoes"], full: "Little monkeys love to eat ripe bananas." },
                { text: "She put on her blue coat because it was ___ outside.", blank: "cold", options: ["cold", "hot", "dry"], full: "She put on her blue coat because it was cold outside." },
                { text: "The white fluffy rabbit likes to hop in the ___.", blank: "garden", options: ["garden", "ocean", "cloud"], full: "The white fluffy rabbit likes to hop in the garden." }
            ],
            froggy: [
                { start: 3, jump: 4, type: '+', result: 7 },
                { start: 12, jump: 5, type: '-', result: 7 },
                { start: 6, jump: 6, type: '+', result: 12 },
                { start: 15, jump: 8, type: '-', result: 7 },
                { start: 4, jump: 9, type: '+', result: 13 }
            ],
            thousands: [
                { number: 4829, wordFormat: "Four thousand, eight hundred twenty-nine" },
                { number: 1250, wordFormat: "One thousand, two hundred fifty" },
                { number: 7093, wordFormat: "Seven thousand, ninety-three" },
                { number: 9999, wordFormat: "Nine thousand, nine hundred ninety-nine" },
                { number: 3401, wordFormat: "Three thousand, four hundred one" }
            ],
            placevalue: [
                { thousands: 2, hundreds: 4, tens: 3, units: 5, number: 2435 },
                { thousands: 1, hundreds: 0, tens: 6, units: 2, number: 1062 },
                { thousands: 3, hundreds: 5, tens: 1, units: 8, number: 3518 },
                { thousands: 4, hundreds: 2, tens: 0, units: 4, number: 4204 }
            ],
            addition: [
                { num1: 3784, num2: 2568, sum: 6352 },
                { num1: 4659, num2: 1873, sum: 6532 },
                { num1: 2895, num2: 3417, sum: 6312 },
                { num1: 5248, num2: 2964, sum: 8212 }
            ],
            subtraction: [
                { minuend: 6243, subtrahend: 2815, difference: 3428 },
                { minuend: 5412, subtrahend: 1638, difference: 3774 },
                { minuend: 8000, subtrahend: 3421, difference: 4579 }
            ],
            multiplication: [
                { factor1: 143, factor2: 4, product: 572 },
                { factor1: 216, factor2: 3, product: 648 },
                { factor1: 324, factor2: 5, product: 1620 },
                { factor1: 108, factor2: 6, product: 648 }
            ],
            ordering: [
                { numbers: [42, 18, 89, 31, 65], type: "ascending", sorted: [18, 31, 42, 65, 89] },
                { numbers: [340, 120, 890, 550, 410], type: "descending", sorted: [890, 550, 410, 340, 120] },
                { numbers: [15, 9, 27, 3, 18], type: "ascending", sorted: [3, 9, 15, 18, 27] }
            ]
        };

        /**
         * Fetch a fresh question using Gemini API (gemini-2.5-flash) or Fallback
         */
        async function fetchNewQuestion(showToastNotice = false) {
            if (isAILoading) return;
            isAILoading = true;

            const newQBtn = document.getElementById('btn-new-q');
            const icon = document.getElementById('new-q-icon');
            if (icon) icon.classList.add('fa-spin');
            if (newQBtn) newQBtn.disabled = true;

            const mod = MODULES[currentModuleIndex];
            
            // Generate System Prompt for exact Module Structure
            const systemPrompt = `You are an educational AI generator for a kids' interactive learning web application. 
Generate a single, brand-new, age-appropriate question object for the module "${mod.name}" (ID: ${mod.id}).
Output ONLY valid raw JSON with NO markdown formatting, NO backticks, and NO extra text.

Data Format rules based on module ID:
- "flashcards": {"word": "STRING (6-10 letters)", "category": "STRING", "hint": "STRING"}
- "sentences": {"text": "STRING with ___ blank", "blank": "CORRECT_WORD", "options": ["3 options array containing blank"], "full": "COMPLETE SENTENCE"}
- "froggy": {"start": NUMBER (1-10), "jump": NUMBER (1-9), "type": "+" or "-", "result": NUMBER (1-20)}
- "thousands": {"number": NUMBER (1000-9999), "wordFormat": "Number in English words"}
- "placevalue": {"thousands": NUMBER(0-5), "hundreds": NUMBER(0-9), "tens": NUMBER(0-9), "units": NUMBER(0-9), "number": COMBINED_NUMBER}
- "addition": {"num1": NUMBER(1000-8000), "num2": NUMBER(1000-8000), "sum": SUM_OF_NUM1_AND_NUM2}
- "subtraction": {"minuend": NUMBER(2000-9999), "subtrahend": NUMBER(1000-minuend-1), "difference": MINUEND_MINUS_SUBTRAHEND}
- "multiplication": {"factor1": NUMBER(100-400), "factor2": NUMBER(2-8), "product": FACTOR1*FACTOR2}
- "ordering": {"numbers": [ARRAY OF 5 NUMBERS], "type": "ascending" OR "descending", "sorted": [CORRECTLY SORTED ARRAY]}`;

            const userQuery = `Generate a fresh, fun, non-repeating question for module ${mod.name}. Timestamp random seed: ${Date.now()}`;
            const apiKey = ""; // Canvas runtime provides standard key
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userQuery }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                if (!response.ok) throw new Error("API call failed");

                const result = await response.json();
                const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!jsonText) throw new Error("Empty response");

                const parsedData = JSON.parse(jsonText);
                currentQuestionData = parsedData;

                if (showToastNotice) showToast("✨ Fresh AI Question Ready!", "bg-emerald-600");
            } catch (err) {
                console.warn("Using local fallback question pool due to:", err);
                // Fallback to local pool
                const pool = FALLBACK_POOLS[mod.id];
                const randomIndex = Math.floor(Math.random() * pool.length);
                currentQuestionData = pool[randomIndex];
                if (showToastNotice) showToast("Loaded New Local Question", "bg-indigo-600");
            } finally {
                isAILoading = false;
                if (icon) icon.classList.remove('fa-spin');
                if (newQBtn) newQBtn.disabled = false;
                renderCurrentModule();
            }
        }

        /**
         * Render Top Navigation Tabs
         */
        function renderTabs() {
            const container = document.getElementById('module-tabs');
            container.innerHTML = MODULES.map((m, idx) => `
                <button onclick="switchModule(${idx})" class="px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 whitespace-nowrap transition-all ${
                    idx === currentModuleIndex 
                    ? 'bg-indigo-600 text-white shadow-md' 
                    : 'bg-white text-slate-600 hover:bg-slate-200 border border-slate-200'
                }">
                    <i class="fa-solid ${m.icon}"></i>
                    <span>${m.name}</span>
                </button>
            `).join('');

            document.getElementById('module-indicator').innerText = MODULES[currentModuleIndex].name;
        }

        function switchModule(index) {
            if (currentModuleIndex === index) return;
            currentModuleIndex = index;
            renderTabs();
            fetchNewQuestion();
        }

        /**
         * Speech Synthesis Helper
         */
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            } else {
                showToast("Speech synthesis not supported on this device.", "bg-slate-700");
            }
        }

        /**
         * Award Stars & Handle Success
         */
        function handleCorrectAnswer(customMsg = "Super Job! 🎉") {
            starPoints += 10;
            document.getElementById('star-count').innerText = starPoints;
            showToast(`${customMsg} (+10 Stars)`, "bg-emerald-500");
            
            // Automatically trigger Gemini API call for next question
            setTimeout(() => {
                fetchNewQuestion(false);
            }, 1200);
        }

        function showToast(msg, bgClass = "bg-indigo-600") {
            const toast = document.getElementById('toast');
            toast.className = `fixed bottom-16 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-2xl text-white font-bold text-base shadow-xl transition-all flex items-center gap-2 ${bgClass}`;
            toast.innerHTML = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        }

        /**
         * Main Module Renderer Router
         */
        function renderCurrentModule() {
            const stage = document.getElementById('module-stage');
            const data = currentQuestionData;
            const modId = MODULES[currentModuleIndex].id;

            if (!data) return;

            switch (modId) {
                case 'flashcards':
                    stage.innerHTML = `
                        <div class="flex flex-col items-center gap-6 w-full max-w-lg">
                            <span class="bg-amber-100 text-amber-800 font-bold px-4 py-1 rounded-full text-xs uppercase tracking-wider">
                                ${data.category || 'Vocabulary'}
                            </span>
                            <div class="text-5xl md:text-6xl font-fredoka font-bold text-indigo-700 tracking-wider text-center py-4 bg-indigo-50 border-2 border-indigo-100 w-full rounded-2xl shadow-inner">
                                ${data.word}
                            </div>
                            <p class="text-slate-500 italic text-sm text-center font-semibold">"${data.hint || 'Read the word aloud!'}"</p>
                            
                            <!-- Speech Button -->
                            <button onclick="speakText('${data.word}')" class="bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold px-5 py-2.5 rounded-xl flex items-center gap-2 shadow transition-all active:scale-95">
                                <i class="fa-solid fa-volume-high text-lg"></i> Listen Word
                            </button>

                            <hr class="w-full border-slate-200 my-2">

                            <!-- Parent Verification Buttons -->
                            <div class="flex flex-col sm:flex-row gap-3 w-full">
                                <button onclick="handleCorrectAnswer('Great Reading! 🎉')" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition-all active:scale-95 text-center">
                                    Said It Right! 🎉
                                </button>
                                <button onclick="showToast('Keep practicing! Try again 🔄', 'bg-amber-500')" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-4 rounded-2xl transition-all active:scale-95 text-center">
                                    Try Again 🔄
                                </button>
                            </div>
                        </div>
                    `;
                    break;

                case 'sentences':
                    const optionsHtml = (data.options || []).map(opt => `
                        <button onclick="checkSentenceAnswer('${opt}', '${data.blank}')" class="bg-indigo-50 border-2 border-indigo-200 hover:bg-indigo-600 hover:text-white text-indigo-800 font-bold text-lg px-6 py-3 rounded-2xl shadow-sm transition-all active:scale-95">
                            ${opt}
                        </button>
                    `).join('');

                    stage.innerHTML = `
                        <div class="flex flex-col items-center gap-6 w-full max-w-xl">
                            <div class="text-xl md:text-2xl font-bold text-slate-800 text-center leading-relaxed bg-slate-50 p-6 rounded-2xl border-2 border-slate-200 w-full shadow-inner">
                                ${data.text.replace('___', '<span class="underline decoration-4 decoration-indigo-500 text-indigo-600 px-2">___</span>')}
                            </div>

                            <button onclick="speakText('${data.full}')" class="bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold px-4 py-2 rounded-xl flex items-center gap-2 text-sm shadow transition-all">
                                <i class="fa-solid fa-volume-high"></i> Read Full Sentence
                            </button>

                            <div class="w-full">
                                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider text-center mb-3">Choose the missing word:</p>
                                <div class="flex flex-wrap justify-center gap-3">
                                    ${optionsHtml}
                                </div>
                            </div>

                            <hr class="w-full border-slate-200 my-1">

                            <div class="flex gap-3 w-full">
                                <button onclick="handleCorrectAnswer('Parent Verified! ⭐')" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-3 rounded-xl shadow transition-all text-sm">
                                    Parent Verified! 🎉
                                </button>
                            </div>
                        </div>
                    `;
                    break;

                case 'froggy':
                    stage.innerHTML = `
                        <div class="flex flex-col items-center gap-6 w-full max-w-2xl">
                            <!-- Equation -->
                            <div class="text-4xl md:text-5xl font-fredoka font-bold text-indigo-700 bg-indigo-50 px-8 py-3 rounded-2xl border-2 border-indigo-100 shadow-inner">
                                ${data.start} ${data.type} ${data.jump} = ?
                            </div>

                            <!-- Number Line Canvas Container -->
                            <div class="w-full overflow-x-auto py-4">
                                <div class="min-w-[500px] flex justify-between items-end relative px-4 pt-12 pb-4 bg-emerald-50 rounded-2xl border-2 border-emerald-200">
                                    ${Array.from({ length: 21 }, (_, i) => `
                                        <div class="flex flex-col items-center relative group">
                                            ${i === data.result ? '<div class="absolute -top-10 text-2xl animate-bounce">🪷</div>' : ''}
                                            <button onclick="checkFroggyAnswer(${i}, ${data.result})" class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm ${
                                                i === data.start ? 'bg-indigo-600 text-white ring-4 ring-indigo-200' : 'bg-white border border-emerald-300 text-emerald-800 hover:bg-emerald-200'
                                            }">
                                                ${i}
                                            </button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            <p class="text-xs text-slate-400 font-bold uppercase">Click on the correct Lilypad number where Froggy lands!</p>
                        </div>
                    `;
                    break;

                case 'thousands':
                    stage.innerHTML = `
                        <div class="flex flex-col items-center gap-6 w-full max-w-lg">
                            <span class="text-xs font-bold uppercase text-slate-400 tracking-wider">Read this large number out loud</span>
                            
                            <div class="text-6xl font-fredoka font-bold text-indigo-600 tracking-widest bg-slate-50 border-2 border-slate-200 px-10 py-6 rounded-3xl shadow-inner">
                                ${data.number.toLocaleString()}
                            </div>

                            <button onclick="speakText('${data.number}')" class="bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold px-5 py-2.5 rounded-xl flex items-center gap-2 shadow transition-all">
                                <i class="fa-solid fa-volume-high"></i> Listen Pronunciation
                            </button>

                            <p class="text-slate-500 text-center font-medium text-sm">Word Form: "<span class="font-bold text-slate-700">${data.wordFormat || data.number}</span>"</p>

                            <hr class="w-full border-slate-200">

                            <!-- Parent Verification -->
                            <div class="flex gap-3 w-full">
                                <button onclick="handleCorrectAnswer('Awesome Number Reading! 🎉')" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition-all active:scale-95 text-center">
                                    Said It Right! 🎉
                                </button>
                                <button onclick="showToast('Try reading once more! 🔄', 'bg-amber-500')" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-4 rounded-2xl transition-all active:scale-95 text-center">
                                    Try Again 🔄
                                </button>
                            </div>
                        </div>
                    `;
                    break;

                case 'placevalue':
                    // Reset user counts on new target
                    pvUserCounts = { thousands: 0, hundreds: 0, tens: 0, units: 0 };
                    stage.innerHTML = `
                        <div class="flex flex-col items-center gap-6 w-full max-w-xl">
                            <div class="text-center">
                                <span class="text-xs font-bold uppercase text-slate-400">Target Number</span>
                                <div class="text-4xl font-fredoka font-bold text-indigo-700">${data.number}</div>
                            </div>

                            <!-- 4 Columns Stack Representation -->
                            <div class="grid grid-cols-4 gap-2 md:gap-4 w-full bg-slate-50 p-4 rounded-2xl border-2 border-slate-200">
                                ${['thousands', 'hundreds', 'tens', 'units'].map(col => `
                                    <div class="flex flex-col items-center">
                                        <span class="text-xs font-bold uppercase text-slate-500 mb-2">${col}</span>
                                        <div id="stack-${col}" class="block-stack border-b-2 border-slate-300 w-full mb-3">
                                            <!-- Dynamic Blocks -->
                                        </div>
                                        <div class="flex gap-1">
                                            <button onclick="updatePVStack('${col}', 1, ${data.thousands}, ${data.hundreds}, ${data.tens}, ${data.units})" class="w-8 h-8 rounded-full bg-emerald-500 text-white font-bold flex items-center justify-center hover:bg-emerald-600 shadow">+</button>
                                            <button onclick="updatePVStack('${col}', -1, ${data.thousands}, ${data.hundreds}, ${data.tens}, ${data.units})" class="w-8 h-8 rounded-full bg-rose-500 text-white font-bold flex items-center justify-center hover:bg-rose-600 shadow">-</button>
                                        </div>
                                        <span id="count-${col}" class="font-fredoka text-lg mt-1 font-bold text-slate-700">0</span>
                                    </div>
                                `).join('')}
                            </div>

                            <button onclick="checkPlaceValueAnswer(${data.thousands}, ${data.hundreds}, ${data.tens}, ${data.units})" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 py-3 rounded-2xl shadow-md transition-all active:scale-95">
                                Check Representation
                            </button>
                        </div>
                    `;
                    break;

                case 'addition':
                    stage.innerHTML = `
                        <div class="flex flex-col items-center gap-6 w-full max-w-md">
                            <span class="text-xs font-bold uppercase text-slate-400">Solve Addition with Carry</span>
                            
                            <!-- Math Grid 5-Column Right to Left -->
                            <div class="bg-indigo-50/50 p-6 rounded-3xl border-2 border-indigo-100 w-full">
                                <div class="grid grid-cols-5 gap-2 text-center items-center font-fredoka font-bold text-xl">
                                    <!-- Header Column labels -->
                                    <span class="text-xs text-slate-400"></span>
                                    <span class="text-xs text-slate-400">Th</span>
                                    <span class="text-xs text-slate-400">H</span>
                                    <span class="text-xs text-slate-400">T</span>
                                    <span class="text-xs text-slate-400">U</span>

                                    <!-- Carry Input Row -->
                                    <span class="text-xs font-bold text-amber-600">Carry</span>
                                    <input type="text" id="add-c3" maxlength="1" class="w-10 h-8 text-center bg-amber-100 border border-amber-300 rounded-lg text-sm text-amber-900 mx-auto">
                                    <input type="text" id="add-c2" maxlength="1" class="w-10 h-8 text-center bg-amber-100 border border-amber-300 rounded-lg text-sm text-amber-900 mx-auto">
                                    <input type="text" id="add-c1" maxlength="1" class="w-10 h-8 text-center bg-amber-100 border border-amber-300 rounded-lg text-sm text-amber-900 mx-auto">
                                    <span class="text-xs text-slate-300">-</span>

                                    <!-- Addend 1 -->
                                    <span></span>
                                    ${String(data.num1).padStart(4, ' ').split('').map(d => `<span>${d}</span>`).join('')}

                                    <!-- Addend 2 with Plus Sign -->
                                    <span class="text-indigo-600">+</span>
                                    ${String(data.num2).padStart(4, ' ').split('').map(d => `<span>${d}</span>`).join('')}
                                </div>

                                <hr class="border-t-2 border-slate-800 my-3">

                                <!-- Answer Input Row -->
                                <div class="grid grid-cols-5 gap-2 text-center">
                                    <span class="text-xs font-bold text-indigo-600 self-center">Ans</span>
                                    <input type="text" id="add-a3" maxlength="1" class="w-10 h-12 text-center font-fredoka text-xl bg-white border-2 border-indigo-200 rounded-xl mx-auto focus:border-indigo-600 outline-none">
                                    <input type="text" id="add-a2" maxlength="1" class="w-10 h-12 text-center font-fredoka text-xl bg-white border-2 border-indigo-200 rounded-xl mx-auto focus:border-indigo-600 outline-none">
                                    <input type="text" id="add-a1" maxlength="1" class="w-10 h-12 text-center font-fredoka text-xl bg-white border-2 border-indigo-200 rounded-xl mx-auto focus:border-indigo-600 outline-none">
                                    <input type="text" id="add-a0" maxlength="1" class="w-10 h-12 text-center font-fredoka text-xl bg-white border-2 border-indigo-200 rounded-xl mx-auto focus:border-indigo-600 outline-none">
                                </div>
                            </div>

                            <button onclick="checkAdditionAnswer(${data.sum})" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 py-3 rounded-2xl shadow-md transition-all active:scale-95">
                                Check Answer
                            </button>
                        </div>
                    `;
                    break;

                case 'subtraction':
                    stage.innerHTML = `
                        <div class="flex flex-col items-center gap-6 w-full max-w-md">
                            <span class="text-xs font-bold uppercase text-slate-400">Solve Subtraction with Borrow</span>
                            
                            <div class="bg-indigo-50/50 p-6 rounded-3xl border-2 border-indigo-100 w-full">
                                <div class="grid grid-cols-5 gap-2 text-center items-center font-fredoka font-bold text-xl">
                                    <!-- Header Column labels -->
                                    <span class="text-xs text-slate-400"></span>
                                    <span class="text-xs text-slate-400">Th</span>
                                    <span class="text-xs text-slate-400">H</span>
                                    <span class="text-xs text-slate-400">T</span>
                                    <span class="text-xs text-slate-400">U</span>

                                    <!-- Borrow Indicator Row -->
                                    <span class="text-xs font-bold text-rose-600">Borrow</span>
                                    <input type="text" id="sub-b3" maxlength="2" class="w-10 h-8 text-center bg-rose-100 border border-rose-300 rounded-lg text-xs text-rose-900 mx-auto">
                                    <input type="text" id="sub-b2" maxlength="2" class="w-10 h-8 text-center bg-rose-100 border border-rose-300 rounded-lg text-xs text-rose-900 mx-auto">
                                    <input type="text" id="sub-b1" maxlength="2" class="w-10 h-8 text-center bg-rose-100 border border-rose-300 rounded-lg text-xs text-rose-900 mx-auto">
                                    <input type="text" id="sub-b0" maxlength="2" class="w-10 h-8 text-center bg-rose-100 border border-rose-300 rounded-lg text-xs text-rose-900 mx-auto">

                                    <!-- Minuend -->
                                    <span></span>
                                    ${String(data.minuend).padStart(4, ' ').split('').map(d => `<span>${d}</span>`).join('')}

                                    <!-- Subtrahend -->
                                    <span class="text-rose-600">-</span>
                                    ${String(data.subtrahend).padStart(4, ' ').split('').map(d => `<span>${d}</span>`).join('')}
                                </div>

                                <hr class="border-t-2 border-slate-800 my-3">

                                <!-- Result Row -->
                                <div class="grid grid-cols-5 gap-2 text-center">
                                    <span class="text-xs font-bold text-indigo-600 self-center">Ans</span>
                                    <input type="text" id="sub-a3" maxlength="1" class="w-10 h-12 text-center font-fredoka text-xl bg-white border-2 border-indigo-200 rounded-xl mx-auto">
                                    <input type="text" id="sub-a2" maxlength="1" class="w-10 h-12 text-center font-fredoka text-xl bg-white border-2 border-indigo-200 rounded-xl mx-auto">
                                    <input type="text" id="sub-a1" maxlength="1" class="w-10 h-12 text-center font-fredoka text-xl bg-white border-2 border-indigo-200 rounded-xl mx-auto">
                                    <input type="text" id="sub-a0" maxlength="1" class="w-10 h-12 text-center font-fredoka text-xl bg-white border-2 border-indigo-200 rounded-xl mx-auto">
                                </div>
                            </div>

                            <button onclick="checkSubtractionAnswer(${data.difference})" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 py-3 rounded-2xl shadow-md transition-all active:scale-95">
                                Check Answer
                            </button>
                        </div>
                    `;
                    break;

                case 'multiplication':
                    stage.innerHTML = `
                        <div class="flex flex-col items-center gap-6 w-full max-w-lg">
                            <span class="text-xs font-bold uppercase text-slate-400">Horizontal Multiplication</span>
                            
                            <div class="flex items-center justify-center gap-3 bg-indigo-50 p-6 rounded-3xl border-2 border-indigo-100 w-full shadow-inner font-fredoka text-3xl md:text-4xl font-bold text-slate-800">
                                <span>${data.factor1}</span>
                                <span class="text-indigo-600">×</span>
                                <span>${data.factor2}</span>
                                <span>=</span>
                                <input type="number" id="mult-input" class="w-32 h-14 text-center bg-white border-2 border-indigo-300 rounded-2xl text-indigo-700 outline-none focus:border-indigo-600" placeholder="?">
                            </div>

                            <button onclick="checkMultiplicationAnswer(${data.product})" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 py-3 rounded-2xl shadow-md transition-all active:scale-95">
                                Submit Answer
                            </button>
                        </div>
                    `;
                    break;

                case 'ordering':
                    stage.innerHTML = `
                        <div class="flex flex-col items-center gap-6 w-full max-w-xl">
                            <div class="text-center">
                                <span class="text-xs font-bold uppercase text-slate-400">Order numbers in <strong class="text-indigo-600 uppercase">${data.type}</strong> order</span>
                                <div class="flex gap-2 justify-center mt-2 flex-wrap">
                                    ${data.numbers.map(n => `<span class="bg-slate-100 border border-slate-300 px-3 py-1 rounded-xl font-bold text-slate-700">${n}</span>`).join('')}
                                </div>
                            </div>

                            <!-- Staircase Visual Container -->
                            <div class="flex items-end justify-center gap-2 w-full h-48 bg-slate-50 p-4 rounded-2xl border-2 border-slate-200">
                                ${Array.from({ length: 5 }, (_, i) => `
                                    <div class="flex-1 flex flex-col items-center justify-end h-full">
                                        <input type="number" id="stair-${i}" class="w-full h-12 text-center font-fredoka font-bold text-indigo-700 bg-white border-2 border-indigo-200 rounded-xl mb-1 focus:border-indigo-600 outline-none" placeholder="#${i+1}">
                                        <div class="w-full bg-indigo-300 rounded-t-lg transition-all" style="height: ${(i + 1) * 18}%;"></div>
                                    </div>
                                `).join('')}
                            </div>

                            <button onclick="checkOrderingAnswer(${JSON.stringify(data.sorted).replace(/"/g, '&quot;')})" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 py-3 rounded-2xl shadow-md transition-all active:scale-95">
                                Verify Order
                            </button>
                        </div>
                    `;
                    break;
            }
        }

        // Module 2 Helper
        function checkSentenceAnswer(selected, correct) {
            if (selected.toLowerCase() === correct.toLowerCase()) {
                handleCorrectAnswer("Correct Word! 🎯");
            } else {
                showToast("Not quite right, try again!", "bg-rose-500");
            }
        }

        // Module 3 Helper
        function checkFroggyAnswer(selected, correct) {
            if (selected === correct) {
                handleCorrectAnswer("Froggy landed safely! 🐸");
            } else {
                showToast("Froggy missed! Try another lilypad.", "bg-rose-500");
            }
        }

        // Module 5 Helper
        function updatePVStack(col, delta, targetT, targetH, targetTe, targetU) {
            pvUserCounts[col] = Math.max(0, Math.min(9, pvUserCounts[col] + delta));
            document.getElementById(`count-${col}`).innerText = pvUserCounts[col];

            const stack = document.getElementById(`stack-${col}`);
            stack.innerHTML = '';
            for (let i = 0; i < pvUserCounts[col]; i++) {
                const block = document.createElement('div');
                if (col === 'thousands') block.className = 'thousand-cube';
                else if (col === 'hundreds') block.className = 'hundred-flat';
                else if (col === 'tens') block.className = 'ten-rod';
                else block.className = 'unit-cube';
                stack.appendChild(block);
            }
        }

        function checkPlaceValueAnswer(t, h, te, u) {
            if (pvUserCounts.thousands === t &&
                pvUserCounts.hundreds === h &&
                pvUserCounts.tens === te &&
                pvUserCounts.units === u) {
                handleCorrectAnswer("Perfect Block Representation! 🧊");
            } else {
                showToast("Counts do not match target number yet!", "bg-rose-500");
            }
        }

        // Module 6 Helper
        function checkAdditionAnswer(expectedSum) {
            const a3 = document.getElementById('add-a3').value || '0';
            const a2 = document.getElementById('add-a2').value || '0';
            const a1 = document.getElementById('add-a1').value || '0';
            const a0 = document.getElementById('add-a0').value || '0';
            
            const userSum = parseInt(`${a3}${a2}${a1}${a0}`, 10);
            if (userSum === expectedSum) {
                handleCorrectAnswer("Addition Correct! ➕");
            } else {
                showToast("Check your addition columns again!", "bg-rose-500");
            }
        }

        // Module 7 Helper
        function checkSubtractionAnswer(expectedDiff) {
            const a3 = document.getElementById('sub-a3').value || '0';
            const a2 = document.getElementById('sub-a2').value || '0';
            const a1 = document.getElementById('sub-a1').value || '0';
            const a0 = document.getElementById('sub-a0').value || '0';

            const userDiff = parseInt(`${a3}${a2}${a1}${a0}`, 10);
            if (userDiff === expectedDiff) {
                handleCorrectAnswer("Subtraction Correct! ➖");
            } else {
                showToast("Check your borrowing & math!", "bg-rose-500");
            }
        }

        // Module 8 Helper
        function checkMultiplicationAnswer(expectedProduct) {
            const val = parseInt(document.getElementById('mult-input').value, 10);
            if (val === expectedProduct) {
                handleCorrectAnswer("Multiplication Correct! ✖️");
            } else {
                showToast("Incorrect product, try calculating again!", "bg-rose-500");
            }
        }

        // Module 9 Helper
        function checkOrderingAnswer(expectedSorted) {
            const userSorted = [];
            for (let i = 0; i < 5; i++) {
                const val = parseInt(document.getElementById(`stair-${i}`).value, 10);
                userSorted.push(val);
            }

            const isCorrect = userSorted.every((v, idx) => v === expectedSorted[idx]);
            if (isCorrect) {
                handleCorrectAnswer("Numbers ordered perfectly! 📶");
            } else {
                showToast("Order is incorrect, check staircase numbers!", "bg-rose-500");
            }
        }

        window.onload = () => {
            renderTabs();
            fetchNewQuestion();
        };
    </script>
</body>
</html>
